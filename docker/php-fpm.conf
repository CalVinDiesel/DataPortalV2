; PHP-FPM Pool Configuration for DataPortalV2 — Docker Production
; This pool is tuned to handle 16 simultaneous Nitro Engine chunk uploads
; from a single user, with headroom for multiple concurrent users.

[www]
user  = www-data
group = www-data

; Listen on a Unix socket (faster than TCP for same-container communication)
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Worker process management ─────────────────────────────────────────────────
; dynamic: PHP-FPM scales workers up and down based on current load
pm                   = dynamic
; Maximum number of simultaneous PHP processes (16 lanes + overhead)
pm.max_children      = 32
; Workers pre-started when PHP-FPM launches
pm.start_servers     = 8
; Minimum idle workers kept alive (reduces cold-start latency)
pm.min_spare_servers = 4
; Maximum idle workers before they are killed
pm.max_spare_servers = 16

; ── Timeout for large file operations ────────────────────────────────────────
; 600s = 10 minutes — needed for merging large chunk uploads and SFTP delivery
request_terminate_timeout = 600s

; ── PHP runtime overrides ─────────────────────────────────────────────────────
php_admin_value[upload_max_filesize] = 2048M
php_admin_value[post_max_size]       = 2048M
php_admin_value[memory_limit]        = 512M
php_admin_value[max_execution_time]  = 600
php_admin_value[max_input_time]      = 600
