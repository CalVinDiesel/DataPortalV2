; ─────────────────────────────────────────────────────────────────────────────
; Supervisord Configuration for DataPortalV2 Docker Container
;
; Supervisord is the "container manager". A Docker container normally runs
; only ONE process. We need TWO: Nginx (web server) AND PHP-FPM (PHP worker).
; Supervisord starts and monitors both, restarting either if they crash.
; ─────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true                   ; Run in foreground so Docker can track it
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ── PHP-FPM: The PHP Worker Pool ─────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Nginx: The Web Gateway ────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
