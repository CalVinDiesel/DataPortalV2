##############################################################################
# Nginx configuration — runs INSIDE the Docker container
# This handles all web requests and forwards PHP requests to PHP-FPM
# listening on the Unix socket /run/php-fpm.sock
##############################################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/dataportal.pem;
    ssl_certificate_key /etc/nginx/certs/dataportal.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # The Laravel public directory is the web root
    root /var/www/html/public;
    index index.php index.html;

    # ── Large file uploads (geospatial datasets can be multi-GB) ─────────────
    client_max_body_size 5000M;
    client_body_buffer_size 30M;
    client_body_timeout  600s;
    send_timeout         600s;

    # ── Bypass static asset caching for dynamic viewer assets ──────────────────
    location ^~ /viewer-assets/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Thumbnail image protection ────────────────────────────────────────────
    # ^~ prefix gives this block the HIGHEST priority in Nginx — it beats all
    # regex matches (including the generic ~* static asset block below). This
    # ensures thumbnail files are ALWAYS served as static files directly from
    # disk, never routed through PHP-FPM, and Cloudflare receives explicit
    # 1-year cache headers on every 200 response so it holds the file in cache
    # long-term — even across brief server restarts or Docker rebuilds.
    location ^~ /uploads/thumbnails/ {
        # Serve the file directly from disk; return clean 404 if missing
        try_files $uri =404;

        # Tell Cloudflare (and all CDN/browser caches) to cache this file
        # for 1 full year. Once Cloudflare has a 200, it keeps it.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Proper ETag + Last-Modified so Cloudflare validates correctly
        etag on;
        if_modified_since exact;

        # Security: prevent MIME-type sniffing on image responses
        add_header X-Content-Type-Options "nosniff";
    }

    # ── Standard Laravel routing ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ── PHP-FPM handler ───────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Extended timeouts for large file merging and SFTP delivery operations
        fastcgi_read_timeout    600s;
        fastcgi_send_timeout    600s;
        fastcgi_connect_timeout 60s;

        # Disable request buffering to prevent Nginx from writing chunks to temporary files
        fastcgi_request_buffering off;

        # Buffer settings for smooth large-file streaming
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options      "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection     "1; mode=block";

    # ── Hide Nginx version from response headers ──────────────────────────────
    server_tokens off;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
