##############################################################################
# Nginx configuration — runs INSIDE the Docker container
# This handles all web requests and forwards PHP requests to PHP-FPM
# listening on the Unix socket /run/php-fpm.sock
##############################################################################

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # The Laravel public directory is the web root
    root /var/www/html/public;
    index index.php index.html;

    server_name _;

    # ── Large file uploads (geospatial datasets can be multi-GB) ─────────────
    client_max_body_size 5000M;
    client_body_buffer_size 10M;
    client_body_timeout  600s;
    send_timeout         600s;

    # ── Standard Laravel routing ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM handler ───────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Disable FastCGI request buffering to stream chunks instantly
        fastcgi_request_buffering off;

        # Extended timeouts for large file merging and SFTP delivery operations
        fastcgi_read_timeout    600s;
        fastcgi_send_timeout    600s;
        fastcgi_connect_timeout 60s;

        # Buffer settings for smooth large-file streaming
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options      "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection     "1; mode=block";

    # ── Hide Nginx version from response headers ──────────────────────────────
    server_tokens off;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
