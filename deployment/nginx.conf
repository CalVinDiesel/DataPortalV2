##############################################################################
# Nginx Configuration for DataPortalV2 — Production
# Place this file at: /etc/nginx/sites-available/dataportal
# Then: sudo ln -s /etc/nginx/sites-available/dataportal /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
##############################################################################

server {
    listen 80;
    listen [::]:80;

    # ── Replace with your actual domain ─────────────────────────────────────
    server_name your-domain.com www.your-domain.com;

    # ── Redirect HTTP → HTTPS (uncomment when SSL is configured) ────────────
    # return 301 https://$host$request_uri;

    root /var/www/dataportal/public;
    index index.php index.html;

    # ── Large file uploads (support 2GB+ geospatial datasets) ───────────────
    client_max_body_size 2048M;
    client_body_timeout  600s;
    send_timeout         600s;

    # ── Nitro Engine: support 16 concurrent chunk uploads ───────────────────
    # PHP-FPM handles all concurrency natively — no extra ports needed.
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # adjust PHP version if needed
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts for large file merging + SFTP delivery
        fastcgi_read_timeout  600s;
        fastcgi_send_timeout  600s;
        fastcgi_connect_timeout 60s;

        # Buffer settings for smooth streaming
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # ── Static assets ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ── Hide Nginx version ───────────────────────────────────────────────────
    server_tokens off;

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/dataportal_access.log;
    error_log  /var/log/nginx/dataportal_error.log;
}

