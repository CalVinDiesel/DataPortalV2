; PHP-FPM Pool Configuration for DataPortalV2 — Production
; Place at: /etc/php/8.2/fpm/pool.d/dataportal.conf
; Then: sudo systemctl reload php8.2-fpm

[dataportal]
user  = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data

; ── Worker count ─────────────────────────────────────────────────────────────
; Must be >= 16 to handle 16 simultaneous upload chunks from a single user
; Add more for multiple concurrent users (e.g. 32 for 2 users at once)
pm                   = dynamic
pm.max_children      = 32
pm.start_servers     = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16

; ── Timeouts for large file operations ───────────────────────────────────────
request_terminate_timeout = 600s

; ── PHP ini overrides ─────────────────────────────────────────────────────────
php_admin_value[upload_max_filesize]  = 2048M
php_admin_value[post_max_size]        = 2048M
php_admin_value[memory_limit]         = 512M
php_admin_value[max_execution_time]   = 600
php_admin_value[max_input_time]       = 600

; ── Logs ─────────────────────────────────────────────────────────────────────
php_admin_value[error_log] = /var/log/php/dataportal_fpm_error.log
php_flag[log_errors]       = on
